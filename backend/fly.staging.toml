app = "bizpilot-backend-staging"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[vm]
  memory = "512mb"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20
