app = "bizpilot-backend-staging"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[vm]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[services]]
internal_port = 8000
protocol = "tcp"
ports = [
  { handlers = ["http"], port = 80 },
  { handlers = ["tls", "http"], port = 443 }
]

[services.concurrency]
type = "requests"
hard_limit = 25
soft_limit = 20
